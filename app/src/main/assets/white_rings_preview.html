<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>White Rings Preview</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #111;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
  }
  .frame {
    position: relative;
    width: 400px;
    height: 400px;
    overflow: hidden;
    background: #000;
    border-radius: 2px;
    box-shadow: 4px 8px 16px rgba(0,0,0,.3);
  }
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1px;
    height: 1px;
  }
  .ring {
    position: absolute;
    left: 0;
    bottom: 0;
    transform-origin: 0 0;
  }
  .circle {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1px;
    transform-origin: bottom;
  }
  .circle::after {
    content: '';
    display: block;
    position: absolute;
    top: 0;
    left: -4px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    transform: scale(0);
    animation: pulse 3000ms linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="center" id="center"></div>
  </div>
<script>
  const ringsNum = 10;
  const ringGrow = 6;
  const firstRing = 18;
  const minRadius = 40;
  const distance = 12;
  const delay = 300;
  const center = document.getElementById('center');

  for (let x = 0; x < ringsNum; x++) {
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.animation = `spin ${x * 3 + 7}s linear infinite`;
    const count = firstRing + x * ringGrow;

    for (let y = 0; y < count; y++) {
      const circle = document.createElement('div');
      circle.className = 'circle';
      circle.style.height = `${minRadius + x * distance}px`;
      circle.style.transform = `rotate(${y * (360 / count)}deg)`;
      circle.style.setProperty('--delay', `${delay * x}ms`);
      circle.querySelector?.('::after');
      ring.appendChild(circle);
      circle.style.animationDelay = `${delay * x}ms`;
    }
    center.appendChild(ring);
  }

  // Apply staggered delay to pseudo-elements through generated rules.
  const style = document.createElement('style');
  let css = '';
  for (let i = 1; i <= ringsNum; i++) {
    css += `.ring:nth-child(${i}) .circle::after{animation-delay:${delay * (i - 1)}ms;}\n`;
  }
  style.textContent = css;
  document.head.appendChild(style);
</script>
</body>
</html>
